<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 20px; font-family: Arial; background-image: linear-gradient(lightgreen,white);}
    button { width: 100%; padding: 12px; background: #4285f4; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; transition: 0.5s; }
    button:hover { background: seagreen; box-shadow: 5px 5px 5px black; transform: scale(1.05);}
    #status { margin-top: 15px; text-align: center; padding: 10px; border-radius: 4px; }
    .safe { background: #d4edda; color: #155724; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;}
    .safe:hover{
        background-color: seagreen;
    }
    .unsafe { background: #f8d7da; color: #721c24; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;}
    .unsafe:hover{ background-color: rgb(245, 97, 97);}
  </style>
</head>
<body>
  <h3>URL Safety Check</h3>
  <button id="checkBtn">Check Current Page</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
